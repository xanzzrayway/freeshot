name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Godot version
        run: |
          MM=$(grep -oP '"\K4\.[0-9]+' project.godot | head -1)
          echo "MM=$MM" >> $GITHUB_ENV
          echo "GODOT_VER=$MM.0" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VER }}
          use-dotnet: false
          include-templates: true

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Godot editor settings
        run: |
          mkdir -p $HOME/.config/godot
          cat > $HOME/.config/godot/editor_settings-$MM.tres << EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Export APK
        run: |
          mkdir -p build
          timeout 180 godot --headless --import --quit || true
          timeout 600 godot --headless --verbose --export-debug "Android" build/perang3d.apk > export.log 2>&1 || true
          tail -n 60 export.log
          ls -la build
          test -f build/perang3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: perang3d-apk
          path: build/perang3d.apk
